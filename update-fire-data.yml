name: update-fire-data

on:
  schedule:
    - cron: "10 * * * *"   # 매시 10분(UTC)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch fire data
        run: node scripts/fetch-fire.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fire-daily.json || true
          git diff --staged --quiet || (git commit -m "update fire data" && git push)
